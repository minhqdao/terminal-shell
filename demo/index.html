<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>terminal-shell demo</title>
    <style>
      /* Mirrors the launchers' terminal shell: a fixed column, a hidden
         native input, and a --keyboard-inset var the shell drives. */
      :root {
        --keyboard-inset: 0px;
      }
      body {
        margin: 0;
        background: #1b1b1b;
        color: #d7d7d7;
        font:
          16px/1.45 "SF Mono",
          "Cascadia Mono",
          Menlo,
          Consolas,
          monospace;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 1.5rem 1rem calc(3rem + var(--keyboard-inset));
      }
      h1 {
        font-size: 1rem;
        color: #8f8f8f;
      }
      #terminal-container {
        position: relative;
      }
      #screen {
        height: 60vh;
        overflow: hidden;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      @media (pointer: coarse) and (hover: none) {
        #screen {
          overflow-y: auto;
        }
        html[data-basicade-log="native"] #screen {
          overflow-y: auto;
        }
      }
      .prompt-line {
        display: flex;
        gap: 0.4rem;
      }
      #input {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #cursor.blinking {
        animation: blink 1.06s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      #terminal-input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 1px;
        left: 0;
        bottom: 0;
        border: 0;
        padding: 0;
        background: transparent;
        color: transparent;
        caret-color: transparent;
      }
      #status {
        color: #e2b34c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>terminal-shell — echo engine demo</h1>
      <div id="terminal-container">
        <div id="screen">
          <div id="output"></div>
          <div class="prompt-line">
            <div id="input"></div>
            <span id="cursor"></span>
          </div>
        </div>
        <input
          id="terminal-input"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          enterkeyhint="send"
        />
      </div>
      <p id="status" hidden></p>
    </main>
    <script type="module" src="./launcher.js"></script>
  </body>
</html>
